<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Markets">
  <defs>
    <pattern id="marketG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".16"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".08"/>
    </pattern>
    <radialGradient id="marketV" cx="50%" cy="36%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".24"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#e5ae33"/>

  <!-- layered ground + sun disc -->
  <circle cx="600" cy="300" r="270" fill="#f0c65e"/>
  <path d="M0 620C280 560 470 700 1200 596V800H0Z" fill="#b9522f"/>
  <path d="M0 704C300 660 520 780 1200 700V800H0Z" fill="#8f3c21"/>

  <!-- awning posts -->
  <rect x="246" y="300" width="26" height="380" rx="8" fill="#7e3a22"/>
  <rect x="928" y="300" width="26" height="380" rx="8" fill="#7e3a22"/>

  <!-- striped awning with scalloped hem -->
  <g>
    <path d="M200 300h143v92c0 26-22 44-48 44h-47c-26 0-48-18-48-44Z" fill="#c4402c"/>
    <path d="M343 300h143v92c0 26-22 44-48 44h-47c-26 0-48-18-48-44Z" fill="#f6e8ce"/>
    <path d="M486 300h143v92c0 26-22 44-48 44h-47c-26 0-48-18-48-44Z" fill="#c4402c"/>
    <path d="M629 300h143v92c0 26-22 44-48 44h-47c-26 0-48-18-48-44Z" fill="#f6e8ce"/>
    <path d="M772 300h143v92c0 26-22 44-48 44h-47c-26 0-48-18-48-44Z" fill="#c4402c"/>
    <path d="M915 300h85v92c0 26-22 44-48 44h-37Z" fill="#f6e8ce"/>
  </g>
  <rect x="180" y="266" width="840" height="42" rx="14" fill="#7e3a22"/>

  <!-- counter -->
  <rect x="300" y="540" width="600" height="40" rx="12" fill="#f6e8ce"/>
  <rect x="330" y="580" width="540" height="90" rx="12" fill="#c4402c"/>

  <!-- produce crates -->
  <g>
    <rect x="368" y="452" width="150" height="88" rx="12" fill="#7e3a22"/>
    <circle cx="398" cy="452" r="26" fill="#d84b2e"/>
    <circle cx="452" cy="446" r="30" fill="#6fa83f"/>
    <circle cx="502" cy="454" r="24" fill="#f0c65e"/>
    <rect x="690" y="452" width="150" height="88" rx="12" fill="#7e3a22"/>
    <circle cx="722" cy="450" r="28" fill="#6fa83f"/>
    <circle cx="776" cy="444" r="26" fill="#d84b2e"/>
    <circle cx="824" cy="452" r="22" fill="#f0c65e"/>
  </g>

  <rect width="1200" height="800" fill="url(#marketG)"/>
  <rect width="1200" height="800" fill="url(#marketV)"/>
</svg>
