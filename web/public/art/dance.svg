<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Dance">
  <defs>
    <pattern id="danceG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".13"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="danceV" cx="50%" cy="36%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#200a44"/>

  <!-- glow + ribbons -->
  <circle cx="600" cy="360" r="300" fill="#4a1470"/>
  <path d="M-40 600C200 330 340 690 600 480S960 110 1240 280" fill="none" stroke="#ff4d6d" stroke-width="66" stroke-linecap="round"/>
  <path d="M-40 700C220 470 360 760 620 580S1000 250 1240 400" fill="none" stroke="#ffc43d" stroke-width="38" stroke-linecap="round" stroke-opacity=".9"/>
  <path d="M-40 520C180 300 320 620 560 430S900 60 1240 190" fill="none" stroke="#ff8fd0" stroke-width="20" stroke-linecap="round" stroke-opacity=".8"/>

  <!-- leaping dancer -->
  <g fill="#ffe8e1">
    <circle cx="452" cy="196" r="50"/>
    <path d="M452 256c44 0 72 30 66 72l-24 138 106 152c18 26-22 54-42 30l-116-150-76 166c-12 28-58 10-46-22l86-232-24-92c-10-38 24-62 70-62Z"/>
    <path d="M470 292l-142-96c-26-18 4-58 30-40l140 96Z"/>
    <path d="M486 288l152-84c28-16 52 24 24 40l-150 84Z"/>
  </g>

  <!-- spinning partner -->
  <g fill="#ffc43d">
    <circle cx="808" cy="326" r="42"/>
    <path d="M806 376c38 0 64 28 58 66l-20 116 82 110c14 20-18 44-34 24l-86-108-56 122c-10 24-48 6-38-20l64-172-26-74c-10-36 18-64 56-64Z"/>
    <path d="M822 404l128-52c26-10 44 30 18 42l-134 54Z"/>
  </g>

  <!-- floor -->
  <ellipse cx="600" cy="766" rx="440" ry="48" fill="#ff4d6d" fill-opacity=".30"/>

  <rect width="1200" height="800" fill="url(#danceG)"/>
  <rect width="1200" height="800" fill="url(#danceV)"/>
</svg>
