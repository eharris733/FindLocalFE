<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Music">
  <defs>
    <pattern id="musicG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".13"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="musicV" cx="50%" cy="34%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#2b0b4f"/>

  <!-- spotlight beams -->
  <polygon points="556,-40 120,800 420,800" fill="#e0218a" fill-opacity=".34"/>
  <polygon points="644,-40 780,800 1080,800" fill="#e0218a" fill-opacity=".34"/>
  <polygon points="600,-40 470,800 730,800" fill="#ff6fb5" fill-opacity=".26"/>

  <!-- glow disc -->
  <circle cx="600" cy="300" r="238" fill="#ff6fb5" fill-opacity=".22"/>

  <!-- mic head + bracket + stand -->
  <rect x="548" y="168" width="104" height="196" rx="52" fill="#ffd9f0"/>
  <rect x="566" y="196" width="68" height="12" rx="6" fill="#2b0b4f" fill-opacity=".35"/>
  <rect x="566" y="228" width="68" height="12" rx="6" fill="#2b0b4f" fill-opacity=".35"/>
  <rect x="566" y="260" width="68" height="12" rx="6" fill="#2b0b4f" fill-opacity=".35"/>
  <path d="M506 322v34a94 94 0 0 0 188 0v-34" fill="none" stroke="#ffd9f0" stroke-width="22" stroke-linecap="round"/>
  <rect x="588" y="450" width="24" height="212" rx="12" fill="#ffd9f0"/>
  <ellipse cx="600" cy="676" rx="124" ry="26" fill="#ffd9f0"/>

  <!-- notes -->
  <circle cx="288" cy="470" r="44" fill="#ffc94f"/>
  <rect x="322" y="330" width="16" height="152" rx="8" fill="#ffc94f"/>
  <circle cx="928" cy="382" r="34" fill="#80d8ca"/>
  <rect x="954" y="272" width="14" height="120" rx="7" fill="#80d8ca"/>

  <rect width="1200" height="800" fill="url(#musicG)"/>
  <rect width="1200" height="800" fill="url(#musicV)"/>
</svg>
