<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Literary">
  <defs>
    <pattern id="literaryG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".12"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="literaryV" cx="50%" cy="36%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".26"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#14264a"/>

  <!-- layered ink shapes -->
  <circle cx="600" cy="372" r="296" fill="#1f3a6b"/>
  <path d="M0 640C260 560 420 720 1200 596V800H0Z" fill="#0d1a33"/>

  <!-- open book: left page -->
  <path d="M600 262C480 196 330 184 186 218l50 402c132-28 268-16 364 34Z" fill="#f3e7ce"/>
  <!-- right page -->
  <path d="M600 262c120-66 270-78 414-44l-50 402c-132-28-268-16-364 34Z" fill="#e6d6b4"/>
  <!-- spine -->
  <path d="M600 262v392" fill="none" stroke="#b4532b" stroke-width="18" stroke-linecap="round"/>
  <path d="M600 262c-24 16-24 376 0 392" fill="none" stroke="#8d3d1e" stroke-width="8"/>

  <!-- abstract lines of type (shapes, not text) -->
  <g fill="#14264a" fill-opacity=".30">
    <rect x="252" y="300" width="290" height="16" rx="8"/>
    <rect x="256" y="346" width="262" height="16" rx="8"/>
    <rect x="260" y="392" width="282" height="16" rx="8"/>
    <rect x="264" y="438" width="222" height="16" rx="8"/>
    <rect x="268" y="484" width="256" height="16" rx="8"/>
    <rect x="658" y="300" width="290" height="16" rx="8"/>
    <rect x="662" y="346" width="248" height="16" rx="8"/>
    <rect x="666" y="392" width="276" height="16" rx="8"/>
    <rect x="670" y="438" width="212" height="16" rx="8"/>
  </g>

  <!-- bookmark ribbon -->
  <path d="M760 250v190l44-38 44 38V232Z" fill="#b4532b"/>

  <rect width="1200" height="800" fill="url(#literaryG)"/>
  <rect width="1200" height="800" fill="url(#literaryV)"/>
</svg>
