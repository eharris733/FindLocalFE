<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Fitness and wellness">
  <defs>
    <pattern id="fitnessG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".13"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="fitnessV" cx="50%" cy="36%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".30"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#07484d"/>

  <!-- layered shapes -->
  <circle cx="600" cy="330" r="262" fill="#0b6068"/>
  <path d="M0 470C280 410 470 520 1200 448V800H0Z" fill="#095258"/>
  <path d="M0 650C300 580 470 740 1200 610V800H0Z" fill="#053338"/>

  <!-- pulse line -->
  <path d="M70 330h214l56-120 82 276 76-186 58 106h118l52-84 64 160 56-152h284" fill="none" stroke="#ff6b5a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dumbbell -->
  <g>
    <rect x="424" y="556" width="352" height="46" rx="23" fill="#f2f7e4"/>
    <rect x="346" y="504" width="76" height="150" rx="22" fill="#b6e52a"/>
    <rect x="778" y="504" width="76" height="150" rx="22" fill="#b6e52a"/>
    <rect x="292" y="530" width="50" height="98" rx="18" fill="#f2f7e4"/>
    <rect x="858" y="530" width="50" height="98" rx="18" fill="#f2f7e4"/>
    <rect x="470" y="570" width="260" height="10" rx="5" fill="#07484d" fill-opacity=".25"/>
  </g>

  <!-- droplet + leaf accents -->
  <circle cx="176" cy="190" r="28" fill="#b6e52a" fill-opacity=".8"/>
  <circle cx="1040" cy="214" r="18" fill="#ff6b5a" fill-opacity=".8"/>

  <rect width="1200" height="800" fill="url(#fitnessG)"/>
  <rect width="1200" height="800" fill="url(#fitnessV)"/>
</svg>
