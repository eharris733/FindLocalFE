<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Theater">
  <defs>
    <pattern id="theaterG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".12"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".10"/>
    </pattern>
    <radialGradient id="theaterV" cx="50%" cy="40%" r="78%">
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".32"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#2b0410"/>

  <!-- back wall + stage floor -->
  <rect x="150" y="120" width="900" height="680" fill="#5e0b22"/>
  <polygon points="600,180 300,800 900,800" fill="#f2b535" fill-opacity=".20"/>
  <path d="M150 640h900v160H150Z" fill="#c98f21"/>
  <path d="M150 640h900v22H150Z" fill="#f2b535"/>
  <ellipse cx="600" cy="700" rx="270" ry="66" fill="#f2b535" fill-opacity=".30"/>

  <!-- curtains -->
  <path d="M150 120h300c-26 220-6 420-84 680H150Z" fill="#a8122f"/>
  <path d="M1050 120H750c26 220 6 420 84 680h216Z" fill="#a8122f"/>
  <g fill="#7d0a21">
    <path d="M232 128c18 214 12 410-22 672h-40c34-262 40-458 22-672Z"/>
    <path d="M330 128c12 214 16 410-6 672h-40c22-262 18-458 6-672Z"/>
    <path d="M968 128c-18 214-12 410 22 672h40c-34-262-40-458-22-672Z"/>
    <path d="M870 128c-12 214-16 410 6 672h40c-22-262-18-458-6-672Z"/>
  </g>

  <!-- valance: banner + scallops -->
  <rect x="140" y="48" width="920" height="80" fill="#f2b535"/>
  <g fill="#f2b535">
    <circle cx="180" cy="128" r="40"/><circle cx="260" cy="128" r="40"/><circle cx="340" cy="128" r="40"/>
    <circle cx="420" cy="128" r="40"/><circle cx="500" cy="128" r="40"/><circle cx="580" cy="128" r="40"/>
    <circle cx="660" cy="128" r="40"/><circle cx="740" cy="128" r="40"/><circle cx="820" cy="128" r="40"/>
    <circle cx="900" cy="128" r="40"/><circle cx="980" cy="128" r="40"/><circle cx="1060" cy="128" r="40"/>
  </g>
  <rect x="140" y="36" width="920" height="30" rx="15" fill="#c98f21"/>

  <!-- tie-backs -->
  <circle cx="440" cy="430" r="28" fill="#f2b535"/>
  <circle cx="760" cy="430" r="28" fill="#f2b535"/>

  <rect width="1200" height="800" fill="url(#theaterG)"/>
  <rect width="1200" height="800" fill="url(#theaterV)"/>
</svg>
