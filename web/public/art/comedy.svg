<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Comedy">
  <defs>
    <pattern id="comedyG" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#ffffff" fill-opacity=".14"/>
      <circle cx="12" cy="11" r="1.1" fill="#000000" fill-opacity=".09"/>
    </pattern>
    <radialGradient id="comedyV" cx="50%" cy="36%" r="76%">
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".24"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#ffc42e"/>

  <!-- sunburst rays -->
  <g fill="#ffdf7a" fill-opacity=".55">
    <polygon points="600,400 120,150 60,300"/>
    <polygon points="600,400 1080,150 1140,300"/>
    <polygon points="600,400 240,40 440,-20"/>
    <polygon points="600,400 960,40 760,-20"/>
  </g>

  <!-- orange swoosh -->
  <path d="M0 556C300 452 520 700 1200 512V800H0Z" fill="#f2600c"/>

  <!-- comedy mask -->
  <path d="M600 132c162 0 262 90 262 214 0 214-124 342-262 342S338 560 338 346c0-124 100-214 262-214Z" fill="#3e1b06"/>
  <!-- brow arcs -->
  <path d="M430 300c34-38 92-40 130-8" fill="none" stroke="#ffc42e" stroke-width="18" stroke-linecap="round"/>
  <path d="M640 292c38-32 96-30 130 8" fill="none" stroke="#ffc42e" stroke-width="18" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="496" cy="366" rx="34" ry="42" fill="#ffe9a8"/>
  <ellipse cx="704" cy="366" rx="34" ry="42" fill="#ffe9a8"/>
  <!-- laughing mouth -->
  <path d="M462 468h276c0 104-62 164-138 164s-138-60-138-164Z" fill="#ffe9a8"/>
  <path d="M478 468h244c0 22-8 40-20 40H498c-12 0-20-18-20-40Z" fill="#f2600c"/>
  <ellipse cx="600" cy="612" rx="52" ry="24" fill="#f2600c"/>

  <!-- pop dots -->
  <circle cx="200" cy="200" r="26" fill="#f2600c"/>
  <circle cx="1010" cy="228" r="18" fill="#3e1b06"/>
  <circle cx="1080" cy="640" r="30" fill="#ffdf7a"/>

  <rect width="1200" height="800" fill="url(#comedyG)"/>
  <rect width="1200" height="800" fill="url(#comedyV)"/>
</svg>
